name: Track Upstream Open Terminal

# Polls open-webui/open-terminal for new stable releases and opens a PR bumping
# UPSTREAM_VERSION. Merging that PR triggers ci-build.yml, which publishes the
# image tagged with the new version; when that build finishes successfully it
# fires this workflow again, so the next untracked version is picked up right
# away instead of waiting for the daily schedule.
#
# Why workflow_run in ci-build.yml's direction and not `gh workflow run` from a
# ci-build step:
#   The build should not have to know that upstream tracking exists, and a
#   problem triggering the check must not fail an otherwise good image build.
#   The workflow_run trigger keeps the two workflows decoupled while the
#   `track-upstream` concurrency group still serializes overlapping runs.
#
# Why this workflow lists releases instead of asking for `releases/latest`:
#   Upstream can publish more than one stable release between two daily polls.
#   `releases/latest` only ever returns the newest one, so versions published in
#   between were never seen — v0.14.3 and v0.14.4 landed eleven minutes apart on
#   2026-10-23 and v0.14.3 was skipped. We read the release list, drop
#   drafts/prereleases, sort by semver and bump to the OLDEST missing version, so
#   every gap is eventually picked up and built.
#
# Why one version per run (serial catch-up) and not one PR per gap:
#   Every bump edits the same single-line `UPSTREAM_VERSION` and the same
#   Dockerfile line, so parallel bump PRs conflict with each other and the later
#   ones go stale. Bumping the oldest gap first, then re-checking after each
#   successful build (the daily schedule is a backstop), keeps exactly one open
#   PR at a time and moves `latest` strictly forward.
#
# Do NOT "fix" a gap by pointing UPSTREAM_VERSION at an older tag:
#   `latest` is written only by ci-build.yml from UPSTREAM_VERSION, so moving it
#   backwards would make `latest` regress. Backfilling an already-skipped version
#   is a manual `release-image.yml` dispatch, never an edit of this file.

on:
  schedule:
    # Daily at 06:17 UTC (off-peak minute). This is now a backstop: every
    # successful image build also triggers a check below.
    - cron: '17 6 * * *'
  # Re-check as soon as a build finishes, so a version gap is acted on right
  # after the previous version is published instead of on the next daily poll.
  workflow_run:
    workflows: ['CI Build and Publish']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report the gap list; do not modify files or open a PR.'
        type: boolean
        default: true
      simulate_current_version:
        description: 'Dry run only: pretend UPSTREAM_VERSION is this tag (e.g. 0.13.0) to exercise the gap logic.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: open-webui/open-terminal

concurrency:
  group: track-upstream
  cancel-in-progress: false

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    # Only act when the build that triggered us succeeded. A failed build means
    # the pinned version's image was never published, so advancing the baseline
    # past it would skip a version nobody can pull. Schedule/dispatch runs carry
    # no workflow_run conclusion and are never gated.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          SIMULATE_INPUT: ${{ github.event.inputs.simulate_current_version }}
        run: |
          # Scheduled and build-completion runs always act for real; manual
          # dispatches default to dry run.
          dry="true"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_run" ] || [ "$DRY_RUN_INPUT" = "false" ]; then
            dry="false"
          fi
          if [ -n "$SIMULATE_INPUT" ] && [ "$dry" != "true" ]; then
            echo "::error::simulate_current_version is only allowed with dry_run=true"
            exit 1
          fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"

      - name: Read current pinned version
        id: current
        env:
          SIMULATE_INPUT: ${{ github.event.inputs.simulate_current_version }}
        run: |
          if [ -n "$SIMULATE_INPUT" ]; then
            version="$SIMULATE_INPUT"
            echo "::notice::Simulating current UPSTREAM_VERSION as $version"
          else
            version=$(tr -d '[:space:]' < UPSTREAM_VERSION)
          fi
          if [ -z "$version" ]; then
            echo "::error::UPSTREAM_VERSION is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch recent upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_JSON: ${{ runner.temp }}/releases.json
        run: |
          # One page of 100 is far more than the number of releases upstream can
          # publish between two daily polls; the page is only a window, not a
          # historical record.
          gh api "repos/${UPSTREAM_REPO}/releases?per_page=100" > "$RELEASES_JSON"
          jq -e 'type == "array" and length > 0' "$RELEASES_JSON" > /dev/null
          echo "Fetched $(jq length "$RELEASES_JSON") releases"

      - name: Compute missing stable versions
        id: gaps
        env:
          CUR_VERSION: ${{ steps.current.outputs.version }}
          RELEASES_JSON: ${{ runner.temp }}/releases.json
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          SIMULATE_INPUT: ${{ github.event.inputs.simulate_current_version }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          # Tags like v0.14.3 only. This rejects branches (main, dev) and
          # pre-release/build suffixes, so no non-stable tag can ever be built.
          SEMVER = re.compile(r"v?(\d+(?:\.\d+)*)")

          def parse(tag):
              m = SEMVER.fullmatch(tag.strip())
              if not m:
                  return None
              return tuple(int(p) for p in m.group(1).split("."))

          def fmt(key):
              # UPSTREAM_VERSION and the Dockerfile arg store the *image* tag
              # form, which upstream publishes without a leading "v" (0.14.3),
              # even though its release tags carry one (v0.14.3).
              return ".".join(str(p) for p in key)

          cur_raw = os.environ["CUR_VERSION"].strip()
          cur = parse(cur_raw)
          if cur is None:
              sys.exit(f"Invalid current version: {cur_raw!r}")

          with open(os.environ["RELEASES_JSON"], encoding="utf-8") as fh:
              releases = json.load(fh)

          stable = {}
          skipped = []
          for rel in releases:
              tag = (rel.get("tag_name") or "").strip()
              if rel.get("draft"):
                  skipped.append(f"{tag} (draft)")
                  continue
              if rel.get("prerelease"):
                  skipped.append(f"{tag} (prerelease)")
                  continue
              key = parse(tag)
              if key is None:
                  skipped.append(f"{tag} (not semver)")
                  continue
              # The list is newest-first, so keep the first occurrence.
              stable.setdefault(key, tag)

          missing_keys = sorted(k for k in stable if k > cur)
          missing = [stable[k] for k in missing_keys]
          next_key = missing_keys[0] if missing_keys else None
          newest = max(stable) if stable else None

          cur_seen = cur in stable
          truncated = len(releases) >= 100

          trigger = {
              "schedule": "daily schedule",
              "workflow_run": "image build completed",
          }.get(os.environ.get("TRIGGER", ""), "manual dispatch")

          lines = [
              "### Upstream release check",
              "",
              "| | |",
              "|---|---|",
              f"| Trigger | {trigger} |",
              f"| Current `UPSTREAM_VERSION` | `{cur_raw}`{' (simulated)' if os.environ.get('SIMULATE_INPUT') else ''} |",
              f"| Stable releases in window | {len(stable)} |",
              f"| Newest stable release | `{fmt(newest)}` |" if newest else "| Newest stable release | none |",
              f"| Missing versions (newer than current) | {len(missing)} |",
              f"| Bumping to (oldest gap) | `{fmt(next_key)}` |" if next_key else "| Bumping to | nothing to do |",
              "",
          ]
          if missing_keys:
              lines += ["Gap list, oldest → newest: " + ", ".join(f"`{fmt(v)}`" for v in missing_keys), ""]
              if len(missing_keys) > 1:
                  lines += [
                      f"Serial catch-up: {len(missing_keys) - 1} more version(s) remain after this one. "
                      "Once this PR is merged and its image build succeeds, this workflow re-runs "
                      "automatically and opens the next gap.",
                      "",
                  ]
          if not cur_seen:
              lines += [f"⚠️ Current version `{cur_raw}` is not in the fetched window; the gap list covers only releases in that window.", ""]
          elif truncated:
              lines += ["ℹ️ Release list capped at 100 items; all releases newer than the current version are inside the window.", ""]
          if skipped:
              preview = ", ".join(skipped[:10]) + (" …" if len(skipped) > 10 else "")
              lines += [f"Skipped: {preview}", ""]
          if os.environ.get("DRY_RUN") == "true":
              lines += ["**Dry run — no files were modified and no PR was opened.**", ""]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")

          print("\n".join(lines))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"next={fmt(next_key) if next_key else ''}\n")
              fh.write(f"tag={stable[next_key] if next_key else ''}\n")
              fh.write(f"newest={fmt(newest) if newest else ''}\n")
              fh.write(f"count={len(missing_keys)}\n")
              fh.write("missing_inline=" + ", ".join(f"`{fmt(v)}`" for v in missing_keys) + "\n")
              fh.write("remaining_inline=" + ", ".join(f"`{fmt(v)}`" for v in missing_keys[1:]) + "\n")
          PY

      - name: Check for an already-open bump PR
        id: pr
        if: steps.gaps.outputs.next != '' && steps.mode.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: bump/upstream-${{ steps.gaps.outputs.next }}
        run: |
          # An open PR for this exact version means the bump is already waiting
          # for review, so re-running must be a no-op.
          n=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$n" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Open PR already exists for $BRANCH; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the upstream image tag is published
        if: steps.gaps.outputs.next != '' && steps.mode.outputs.dry_run == 'false'
        env:
          VERSION: ${{ steps.gaps.outputs.next }}
        run: |
          # A release can be tagged a little before its image finishes pushing.
          # Retry before giving up, so a normal race self-heals silently while a
          # real breakage (e.g. upstream renaming its tags) still fails loudly.
          for attempt in $(seq 1 6); do
            token=$(curl -fsSL \
              "https://ghcr.io/token?scope=repository:${UPSTREAM_REPO}:pull&service=ghcr.io" \
              | jq -r .token)
            code=$(curl -s -o /dev/null -w '%{http_code}' -I \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${UPSTREAM_REPO}/manifests/${VERSION}")
            if [ "$code" = "200" ]; then
              echo "ghcr.io/${UPSTREAM_REPO}:${VERSION} is published"
              exit 0
            fi
            echo "attempt ${attempt}/6: ghcr.io/${UPSTREAM_REPO}:${VERSION} -> HTTP ${code}"
            [ "$attempt" -lt 6 ] && sleep 30
          done
          echo "::error::ghcr.io/${UPSTREAM_REPO}:${VERSION} is still unpublished after 6 attempts; not opening a PR."
          exit 1

      - name: Bump UPSTREAM_VERSION and the Dockerfile arg default
        if: steps.gaps.outputs.next != '' && steps.mode.outputs.dry_run == 'false' && steps.pr.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.gaps.outputs.next }}
        run: |
          printf '%s\n' "$VERSION" > UPSTREAM_VERSION
          sed -i "s|^ARG OPEN_TERMINAL_VERSION=.*|ARG OPEN_TERMINAL_VERSION=${VERSION}|" Dockerfile
          # Fail loudly if the Dockerfile line ever moves out from under the sed.
          grep -qx "ARG OPEN_TERMINAL_VERSION=${VERSION}" Dockerfile

      - name: Open pull request
        if: steps.gaps.outputs.next != '' && steps.mode.outputs.dry_run == 'false' && steps.pr.outputs.exists == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            chore(deps): bump upstream open-terminal to ${{ steps.gaps.outputs.next }}
          branch: bump/upstream-${{ steps.gaps.outputs.next }}
          title: |
            chore(deps): bump upstream open-terminal to ${{ steps.gaps.outputs.next }}
          body: |
            Upstream Open Terminal has stable releases newer than the tracked version.

            - Current: `${{ steps.current.outputs.version }}`
            - Bumping to (oldest gap): `${{ steps.gaps.outputs.next }}`
            - Newest stable: `${{ steps.gaps.outputs.newest }}`
            - All missing versions: ${{ steps.gaps.outputs.missing_inline }}
            - Release notes: https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ steps.gaps.outputs.tag }}

            Merging this PR triggers `ci-build.yml`, which builds and publishes `${{ steps.gaps.outputs.next }}` and moves `latest` to it.

            Version bumps are applied one at a time because they all edit the same `UPSTREAM_VERSION`, and `latest` must only move forward. Remaining gaps after this merge: ${{ steps.gaps.outputs.remaining_inline || 'none' }} — when the resulting image build succeeds, `ci-build.yml` re-runs this workflow and the next PR opens automatically; the daily schedule is only a backstop.
          labels: dependencies
          delete-branch: true
